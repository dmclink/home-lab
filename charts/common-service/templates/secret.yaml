{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-secrets" 
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # for the deployment.yaml env var
  database-password: {{ .Values.postgres.password | quote }}
  # passed to app env for connection string
  DATABASE_URL: "postgresql://{{ .Release.Name }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.db_name | default .Release.Name }}"
{{- end }}

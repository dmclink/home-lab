{{- if .Values.nats.enabled }}
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: {{ .Release.Namespace }}-stream
  labels:
    app: {{ .Release.Namespace | quote }}
    app.kubernetes.io/managed-by: "ansible-homelab"
    app.kubernetes.io/name: {{ .Release.Name | quote }}
    app.kubernetes.io/component: "cronjob"
spec:
  name: {{ .Values.nats.streamName | default .Release.Namespace }}
  subjects: 
    - "{{ .Values.nats.streamName | default .Release.Namespace }}"
    - "{{ .Values.nats.streamName | default .Release.Namespace }}.>"
  storage: file
  retention: {{ .Values.nats.retention | default "limits" }}
  maxMsgs: {{ .Values.nats.maxMsgs | default -1 }}
  maxAge: {{ .Values.nats.maxAge | default "0s" }}
  maxBytes: {{ .Values.nats.maxBytes | default -1 }}
{{- end }}

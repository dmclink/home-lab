{{- if and .Values.service .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName | default .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.service.targetPort | default 8080 }}
  selector:
    app: {{ .Values.appName | default .Release.Namespace }}
{{- end }}

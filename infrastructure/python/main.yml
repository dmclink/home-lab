- name: Bootstrap Python 3.14 on MiniPC (Debian)
  hosts: k3s_servers
  gather_facts: false
  become: true
  tasks:
    - name: Install Python 3.14 via Raw SSH
      ansible.builtin.raw: apt-get update && apt-get install -y python3.14 python3.14-venv
      changed_when: false

- name: Bootstrap Python 3.14 on Laptop (Fedora)
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Install Python 3.14 via Raw SSH
      ansible.builtin.raw: dnf install -y python3.14
      changed_when: false

- name: Set Global 3.14 Interpreter
  hosts: all
  gather_facts: false
  tasks:
    - name: Set fact for 3.14
      ansible.builtin.set_fact:
        ansible_python_interpreter: /usr/bin/python3.14

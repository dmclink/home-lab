- name: Load chart defaults
  include_vars:
    file: "{{ project_root }}/charts/common-service/values.yaml"
    name: chart_defaults

- name: Load app overrides
  include_vars:
    file: "{{ values_file }}"
    name: app_overrides
  failed_when: false

- name: Merge overrides with helm defaults into helm_vars
  set_fact:
    helm_vars: "{{ chart_defaults | combine(app_overrides | default({}), recursive=True) }}"

- name: Load app-specific secrets
  ansible.builtin.include_vars:
    file: "{{ app_dir }}/vault.yml"
  failed_when: false

- name: Set operational state
  ansible.builtin.set_fact:
    # Use helm_vars.enabled directly
    workload_state: "{{ 'absent' if (purge | default(false) | bool or not helm_vars.enabled | default(true)) else 'present' }}"
    is_purge: "{{ purge | default(false) | bool }}"
    db_state: "{{ 'absent' if (purge | default(false) | bool) else 'present' }}"

- name: Get source hash for {{ app_name }}
  ansible.builtin.set_fact:
    app_hash: "{{ lookup('ansible.builtin.pipe', 'find ' + project_root + '/apps/' + app_name + ' -type f -not -path \"*/.*\" -exec md5sum {} + | sort | md5sum | cut -d\" \" -f1') }}"

- name: Build and push image
  when: workload_state == 'present'
  block:
  - name: Build image with Podman
    containers.podman.podman_image:
      name: "{{ registry_ip }}:{{ registry_port }}/{{ app_name }}"
      tag: "{{ app_hash }}"
      path: "{{ project_root }}/apps/{{ app_name }}"
      build:
        extra_args: "--tls-verify=false --build-arg APP_NAME={{ app_name }}"
      state: build
    register: build_result

  - name: Push to local registry
    containers.podman.podman_image:
      name: "{{ registry_ip }}:{{ registry_port }}/{{ app_name }}"
      tag: "{{ app_hash }}"
      push: true
      tls_verify: false
    when: build_result.changed

- name: Generate app database password
  set_fact:
    current_app_pass: "{{ vault_app_database_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32 seed=' + app_name + vault_password_generation_seed)) }}"
  delegate_to: localhost
  delegate_facts: true

- name: Postgres setup (Deploy)
  when: (helm_vars.postgres.enabled | default(false) | bool) and not is_purge
  block:

  - name: Ensure app database user exists
    community.postgresql.postgresql_user:
      name: "{{ app_name }}"
      password: "{{ current_app_pass }}"
      state: "{{ db_state }}"
      login_host: "{{ groups['db_servers'][0] }}"
      login_user: "{{ db_super_user | default('postgres') }}"
      login_db: "{{ db_initial_name | default('postgres') }}"
      login_password: "{{ vault_postgres_password }}"
      port: "{{ db_node_port | int }}"
    delegate_to: "{{ groups['db_servers'][0] }}"
    run_once: true

  - name: Ensure application database exists
    community.postgresql.postgresql_db:
      name: "{{ helm_vars.db_name | default(app_name) }}"
      owner: "{{ app_name }}"
      state: "{{ db_state }}"
      login_host: "{{ groups['db_servers'][0] }}"
      login_user: "{{ db_super_user | default('postgres') }}"
      login_password: "{{ vault_postgres_password }}"
      port: "{{ db_node_port | int }}"
    delegate_to: "{{ groups['db_servers'][0] }}"
    run_once: true


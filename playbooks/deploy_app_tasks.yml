- name: Deploy or teardown via Helm
  kubernetes.core.helm:
    name: "{{ app_name }}"
    chart_ref: "{{ project_root }}/charts/common-service"
    release_namespace: "{{ app_name }}"
    create_namespace: true
    state: "{{ workload_state }}"
    values_files: "{{ [values_file] if helm_vars is defined else None | select('string') | list }}"
    values:
      image:
        repository: "{{ registry_ip }}:{{ registry_port }}/{{ app_name }}"
        tag: "{{ app_hash }}"
      postgres:
        enabled: "{{ helm_vars.postgres.enabled | default(false) | bool }}"
        url: "{{ helm_vars.postgres.url | default('') }}"
        host: "{{ helm_vars.postgres.host | default('postgres-service.database.svc.cluster.local') }}"
        password: "{{ current_app_pass }}"
      global:
        controlNodeHost: "{{ control_node_host }}"
  delegate_to: localhost


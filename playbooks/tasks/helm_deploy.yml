- name: Check if Helm release exists
  delegate_to: localhost
  kubernetes.core.helm_info:
    name: "{{ item.name }}"
    release_namespace: "{{ item.name }}"
  register: helm_info
  failed_when: false

- name: Deploy or teardown via Helm
  when: >
    workload_state == 'present' or
    (workload_state == 'absent' and helm_info.releases | default([]) | length > 0)
  delegate_to: localhost
  kubernetes.core.helm:
    name: "{{ item.name }}"
    chart_ref: "{{ project_root }}/charts/{{ item.workloadType | default('deployment') }}"
    release_namespace: "{{ item.name }}"
    create_namespace: true
    state: "{{ workload_state }}"
    values: "{{ item }}"

- name: Determine if NATS is needed by any component
  ansible.builtin.set_fact:
    needs_nats: "{{ final_components | selectattr('nats.enabled', 'defined') | selectattr('nats.enabled', 'equalto', true) | list | length > 0 }}"
  run_once: true


- name: Total Wipe (Purge) Namespace
  kubernetes.core.k8s:
    name: "{{ app_name }}"
    kind: Namespace
    state: absent
  when: is_purge | bool

- name: Prune dangling images
  containers.podman.podman_prune:
    container: true
    image: true
    system_all: false
  when: is_purge | bool

- name: Delete image repository directory from storage
  ansible.builtin.file:
    path: "/home/{{ registry_user }}/registry_data/docker/registry/v2/repositories/{{ app_name }}"
    state: absent
  when: is_purge | bool

- name: Run registry garbage collection
  ansible.builtin.command: >
    podman exec local-registry registry garbage-collect /etc/docker/registry/config.yml
  when: is_purge | bool
  changed_when: true
